<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpendWise - Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>SpendWise 💰</h1>
    <h3>Balance: ₹<span id="balance">0</span></h3>
    <form id="form">
      <input type="text" id="text" placeholder="Description (e.g., Salary, Food)" required>
      <input type="number" id="amount" placeholder="Amount (+income, -expense)" required>
      <button type="submit">Add Transaction</button>
    </form>
    <ul id="list"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
